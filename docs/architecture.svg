<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Arquitetura do Trip Calculator Basic</title>
  <desc id="desc">Frontend estatico se comunica com uma API Flask. A API persiste dados em SQLite e consulta servicos externos de geocodificacao, rotas e clima.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#18324a" flood-opacity="0.16"/>
    </filter>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2d6cdf"/>
    </marker>
    <marker id="arrow-gray" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#718096"/>
    </marker>
    <style>
      .title { font: 700 28px Arial, sans-serif; fill: #18324a; }
      .subtitle { font: 400 15px Arial, sans-serif; fill: #526476; }
      .heading { font: 700 20px Arial, sans-serif; fill: #18324a; }
      .body { font: 400 15px Arial, sans-serif; fill: #334e68; }
      .label { font: 700 13px Arial, sans-serif; fill: #526476; }
      .small { font: 400 13px Arial, sans-serif; fill: #627d98; }
      .box { stroke-width: 2; }
    </style>
  </defs>

  <rect width="1200" height="700" fill="#f7fafc"/>
  <rect x="28" y="28" width="1144" height="644" rx="14" fill="#ffffff" stroke="#d9e2ec"/>

  <text x="600" y="75" text-anchor="middle" class="title">Cenário 1.1 | Trip Calculator Basic</text>
  <text x="600" y="103" text-anchor="middle" class="subtitle">Arquitetura da aplicação para planejamento de viagens rodoviárias</text>

  <!-- Main components -->
  <g filter="url(#shadow)">
    <rect x="78" y="174" width="280" height="150" rx="12" fill="#fff1df" stroke="#2d6cdf" class="box"/>
    <rect x="460" y="174" width="310" height="150" rx="12" fill="#e5f0ff" stroke="#2d6cdf" class="box"/>
    <rect x="930" y="174" width="170" height="150" rx="12" fill="#e8f5e9" stroke="#2d6cdf" class="box"/>
  </g>

  <text x="218" y="220" text-anchor="middle" class="heading">Frontend</text>
  <text x="218" y="249" text-anchor="middle" class="body">HTML, CSS e JavaScript</text>
  <text x="218" y="276" text-anchor="middle" class="small">front/</text>
  <text x="218" y="300" text-anchor="middle" class="small">HTTP :8080</text>

  <text x="615" y="220" text-anchor="middle" class="heading">API Flask</text>
  <text x="615" y="249" text-anchor="middle" class="body">REST/JSON | :5000</text>
  <text x="615" y="276" text-anchor="middle" class="small">validacoes e calculos</text>
  <text x="615" y="300" text-anchor="middle" class="small">api/</text>

  <text x="1015" y="235" text-anchor="middle" class="heading">SQLite</text>
  <text x="1015" y="265" text-anchor="middle" class="body">Persistencia</text>
  <text x="1015" y="294" text-anchor="middle" class="small">trip_calculator.db</text>

  <!-- Main arrows -->
  <line x1="358" y1="249" x2="450" y2="249" stroke="#2d6cdf" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <rect x="361" y="210" width="86" height="28" rx="5" fill="#ffffff" stroke="#d9e2ec"/>
  <text x="404" y="229" text-anchor="middle" class="label">REST/JSON</text>

  <line x1="770" y1="249" x2="920" y2="249" stroke="#2d6cdf" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <rect x="797" y="210" width="100" height="28" rx="5" fill="#ffffff" stroke="#d9e2ec"/>
  <text x="847" y="229" text-anchor="middle" class="label">SQLAlchemy</text>

  <!-- External services -->
  <g filter="url(#shadow)">
    <rect x="330" y="475" width="540" height="126" rx="12" fill="#dce9f8" stroke="#6b8db3" class="box"/>
  </g>
  <text x="600" y="510" text-anchor="middle" class="heading">APIs externas</text>
  <text x="600" y="540" text-anchor="middle" class="body">Nominatim | OSRM | Open-Meteo</text>
  <text x="600" y="568" text-anchor="middle" class="small">Geocodificacao, rotas e previsao do tempo</text>

  <line x1="615" y1="324" x2="615" y2="465" stroke="#718096" stroke-width="3" marker-end="url(#arrow-gray)"/>
  <rect x="643" y="371" width="118" height="28" rx="5" fill="#ffffff" stroke="#d9e2ec"/>
  <text x="702" y="390" text-anchor="middle" class="label">HTTPS / REST</text>

  <!-- Legend -->
  <line x1="90" y1="635" x2="135" y2="635" stroke="#2d6cdf" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <text x="147" y="640" class="small">Fluxo da aplicação</text>
  <line x1="310" y1="635" x2="355" y2="635" stroke="#718096" stroke-width="3" marker-end="url(#arrow-gray)"/>
  <text x="367" y="640" class="small">Integrações externas</text>
</svg>
